events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server {
    listen 80;
    server_name notebook-lm-clone.com;

    root /var/www/frontend;

    location / {
      try_files $uri $uri/ /index.html;
  }
    location /api/ {
      proxy_pass http://app:8000/; 
    }
  }

}
