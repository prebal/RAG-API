services:
  db:
    image: pgvector/pgvector:pg17-trixie
    container_name: notebook_db
    env_file: .env
    networks:
      - db
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d notebook"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ollama:
    build:
      dockerfile: ollama.dockerfile
    environment:
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-llama3.2:1b}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q $$LLM_LOCAL_MODEL"]
      interval: 1m
      timeout: 1m
      retries: 5
      start_period: 10m

  app:
    build:
      dockerfile: app.dockerfile
    container_name: app
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: notebook
      LLM_LOCAL_BASE_URL: http://ollama:11434/v1
      STORAGE: /app/storage
    expose:
      - "8000"
    networks:
      - app
      - db
      - ollama
    volumes:
      - hf_cache:/root/.cache/huggingface
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/'')"',
        ]
      interval: 1m
      timeout: 1m
      retries: 10
      start_period: 1m

  nginx:
    container_name: nginx_container
    build:
      dockerfile: nginx.dockerfile
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app
    ports:
      - "80:80"

  prometheus:
    container_name: prometheus_container
    image: prom/prometheus
    networks:
      - app
      - prometheus_grafana
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
  ollama_data:
  hf_cache:
  storage_data:

networks:
  ollama:
  db:
  app:
  prometheus_grafana:
