[project]
name = "notebooklm-rag"
version = "0.1.0"
description = "Self-hosted NotebookLM-style RAG backend: upload documents, embed them into pgvector, and ask questions answered by a local LLM (Ollama) or any OpenAI-compatible API, streamed over SSE."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymupdf4llm>=1.28.2",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "ruff>=0.16.2",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "ty>=0.0.77",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "types-aiofiles>=25.1.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

