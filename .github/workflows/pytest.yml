name: Pytest

on:
  push:
  pull_request:

jobs:
  pytest:
    name: CI for testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: uv setup
        uses: astral-sh/setup-uv@v6

      - name: Install python
        run: uv python install 3.14

      - name: Sync packages
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest
